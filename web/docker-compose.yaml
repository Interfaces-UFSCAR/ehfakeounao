services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - path: backend/.env
        required: false
    environment:
      - MONGO_URI=mongodb://mongo:27017/ehfakeounao
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    image: mongo:7
    command: ["mongosh", "--quiet", "mongodb://mongo:27017/ehfakeounao", "/seed.js"]
    volumes:
      - ./scripts/seed.js:/seed.js:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
